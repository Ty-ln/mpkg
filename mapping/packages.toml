# Mapping DB v1 – canonical name (based on Debian) → name per backend.
# If a field is missing, the canonical name is used unchanged.
# Covers all top-300 Homebrew formulae that exist in MacPorts under a different name (as of 2026-11-27).

[packages.python3]
macports = "python313"
homebrew = "python@3.13"
debian = "python3"

[packages.nodejs]
macports = "nodejs22"
homebrew = "node"
debian = "nodejs"

[packages.gnupg]
macports = "gnupg2"
homebrew = "gnupg"
debian = "gnupg"

[packages.fd-find]
macports = "fd"
homebrew = "fd"
debian = "fd-find"

[packages.ripgrep]
macports = "ripgrep"
homebrew = "ripgrep"
debian = "ripgrep"

[packages.ffmpeg]
macports = "ffmpeg"
homebrew = "ffmpeg"
debian = "ffmpeg"

# ---------------------------------------------------------------------------
# Mapping DB v1 – candidates for the 54 top-300 formulae that were not found
# (as of 2026-11-27). Comment = confidence of the mapping:
#   certain   = known MacPorts name
#   verify    = plausible, confirm with `mpkg coverage` / `mpkg show`
# If an entry is missing, there is (probably) no MacPorts counterpart.
# ---------------------------------------------------------------------------

[packages.gnu-tar]              # certain
macports = "gnutar"
homebrew = "gnu-tar"

[packages.gnu-sed]              # certain
macports = "gsed"
homebrew = "gnu-sed"

[packages.glib]                 # certain
macports = "glib2"
homebrew = "glib"

[packages.maven]                # certain
macports = "maven3"
homebrew = "maven"

[packages.little-cms2]          # certain
macports = "lcms2"
homebrew = "little-cms2"

[packages.jpeg-xl]              # certain
macports = "libjxl"
homebrew = "jpeg-xl"

[packages.ca-certificates]      # certain
macports = "curl-ca-bundle"
homebrew = "ca-certificates"

[packages.sevenzip]             # verify
macports = "7zip"
homebrew = "sevenzip"

[packages.mysql]                # verify
macports = "mysql8"
homebrew = "mysql"

[packages.mysql-client]         # verify – MacPorts has no client-only package
macports = "mysql8"
homebrew = "mysql-client"

[packages.libpq]                # verify – libpq is part of postgresqlXX
macports = "postgresql18"
homebrew = "libpq"

[packages.ffmpeg-full]          # verify – features via variants (+gpl3 …)
macports = "ffmpeg"
homebrew = "ffmpeg-full"

[packages.gcc]                  # verify – version number
macports = "gcc15"
homebrew = "gcc"

[packages.llvm]                 # verify – version number
macports = "llvm-21"
homebrew = "llvm"

[packages.clang-format]         # verify – clang-format is part of clang-XX
macports = "clang-21"
homebrew = "clang-format"

[packages.openjdk]              # verify – Homebrew "openjdk" = latest version
macports = "openjdk25"
homebrew = "openjdk"

[packages.awscli]               # verify – Python prefix
macports = "py313-awscli"
homebrew = "awscli"

[packages.ansible]              # verify – Python prefix
macports = "py313-ansible"
homebrew = "ansible"

[packages.virtualenv]           # verify – Python prefix
macports = "py313-virtualenv"
homebrew = "virtualenv"

[packages.jupyterlab]           # verify – Python prefix
macports = "py313-jupyterlab"
homebrew = "jupyterlab"

[packages.tldr]                 # verify – Rust client
macports = "tealdeer"
homebrew = "tldr"

[packages.kubectl]
macports = "kubectl-1.37"
homebrew = "kubernetes-cli"
debian = "kubectl"

[packages.whisper-cpp]
macports = "whisper"
homebrew = "whisper.cpp"
debian = "whisper.cpp"

[packages.docker-buildx]
macports = "docker-buildx-plugin"
homebrew = "docker-buildx"
debian = "docker-buildx"

[packages.dotnet]
macports = "dotnet-cli"
homebrew = "dotnet"
debian = "dotnet-sdk-8.0"

[packages.typos]
macports = "typos"
homebrew = "typos-cli"
debian = "typos"

[packages.telnet]
macports = "inetutils"
homebrew = "telnet"
debian = "telnet"

[packages.docker-credential-helpers]
macports = "docker-credential-helper-osxkeychain"
homebrew = "docker-credential-helper"
debian = "golang-docker-credential-helpers"
