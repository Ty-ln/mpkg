[package]
name = "mpkg"
version = "0.6.1"
edition = "2024"
description = "Paketmanager für macOS"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ext4-view = { version = "1.0.0", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
