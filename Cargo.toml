[package]
name = "mpkg"
version = "0.1.0"
edition = "2024"
description = "apt-artiger Paketmanager für macOS"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
